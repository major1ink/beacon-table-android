name: build

# Тег v* — подписанный .apk в релиз этого репозитория вместе с checksums.txt.
# PR и ручной запуск — только артефакт прогона.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Версия
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Ключ подписи
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Сборка
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PappVersion="$VERSION"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/beacon-table_${VERSION}_android.apk"
          (cd dist && sha256sum *.apk > checksums.txt)

      - name: В релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes"
            else
              gh release create "$GITHUB_REF_NAME" --generate-notes
            fi
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      # Зеркало на beacontable.ru (mirror-releases.yml в beacon-table-site).
      # Токен тот же, что у основного репозитория; без него зеркало
      # обновляют вручную из Actions сайта.
      - name: Зеркало на сайте
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_REPO_TOKEN не задан — зеркало не обновляю"
            exit 0
          fi
          gh api repos/major1ink/beacon-table-site/dispatches             -f event_type=android-release-published             -f "client_payload[tag]=$GITHUB_REF_NAME"

      - name: Артефакт прогона
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
