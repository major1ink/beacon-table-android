<!doctype html>
<!-- Вёрстка и цвета — как у экрана запуска десктопа (cmd/beacon-table/desktop_launcher.html в Beacon-Table). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon Table</title>
<style>
  :root {
    --bg: #131318; --panel-bg: #1c1c25; --surface: #26262f; --surface-hover: #303039;
    --border: rgba(255, 255, 255, 0.08); --text: #eee; --text-dim: rgba(238, 238, 238, 0.55);
    --accent: #7c6cf0; --accent-hover: #6a5ae0;
    --danger: #e07a7a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: min(480px, 100%); padding: 24px; border-radius: 18px;
    background: var(--panel-bg); border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
  }
  h1 { margin: 0 0 4px; font: 600 26px/1.2 "Cormorant Garamond", Georgia, serif; letter-spacing: 0.02em; }
  .lead { margin: 0 0 18px; color: var(--text-dim); font-size: 14px; }
  .server {
    display: block; width: 100%; padding: 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  .server:focus { outline: none; border-color: var(--accent); }
  .error { margin: 0 0 14px; padding: 10px 12px; border-radius: 8px; background: rgba(224, 122, 122, 0.12); color: var(--danger); font-size: 14px; }
  button {
    width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; line-height: 1;
  }
  button:active { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; }
  .recent { margin: 18px 0 0; padding: 0; list-style: none; }
  .recent:empty { display: none; }
  .recent li { display: flex; align-items: center; border-top: 1px solid var(--border); }
  .recent button {
    width: auto; min-height: 44px; margin: 0; padding: 0; background: none;
    color: var(--text-dim); font-weight: 400; font-size: 15px; text-align: left;
  }
  .recent .open { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent .open:active { color: var(--text); }
  .recent .forget { width: 44px; font-size: 20px; text-align: center; }
</style>
</head>
<body>
  <form class="card" id="form" novalidate>
    <h1>Beacon Table</h1>
    <p class="lead">Адрес стола — его показывает ведущий. Дома это обычно что-то вроде 192.168.1.10:8080.</p>
    <p class="error" id="error" hidden></p>
    <input class="server" id="server" placeholder="192.168.1.10:8080" inputmode="url" autocomplete="url"
           autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="Адрес сервера">
    <button type="submit" id="open">Открыть стол</button>
    <ul class="recent" id="recent"></ul>
  </form>
  <script>
    const KEY = "servers";
    const MAX_RECENT = 5;
    const form = document.getElementById("form");
    const input = document.getElementById("server");
    const errorBox = document.getElementById("error");
    const recent = document.getElementById("recent");
    const params = new URLSearchParams(location.search);

    let servers = [];
    try {
      servers = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch {}

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(servers));
      } catch {}
    }

    function showError(text) {
      errorBox.textContent = text;
      errorBox.hidden = !text;
    }

    // Без схемы: адрес в локальной сети — http (так стол и запускают дома),
    // остальное — https, как набрал бы человек в адресной строке.
    function serverURL(raw) {
      raw = raw.trim();
      if (!raw) throw new Error("Укажите адрес сервера, например 192.168.1.10:8080");
      if (!raw.includes("://")) raw = (isLocal(raw.split(/[/:]/)[0]) ? "http://" : "https://") + raw;
      const bad = new Error("Не похоже на адрес сервера: " + raw);
      let url;
      try {
        url = new URL(raw);
      } catch {
        throw bad;
      }
      if (url.protocol !== "http:" && url.protocol !== "https:") throw bad;
      const host = url.hostname.replace(/^\[|\]$/g, "");
      if (!isLocal(host) && !host.replace(/^\.+|\.+$/g, "").includes(".")) throw bad;
      return raw;
    }

    function isLocal(host) {
      return host === "localhost" || host.endsWith(".local") || /^[\d.]+$/.test(host) || host.includes(":");
    }

    function open(raw) {
      let url;
      try {
        url = serverURL(raw);
      } catch (e) {
        showError(e.message);
        return;
      }
      servers = [url, ...servers.filter((s) => s !== url)].slice(0, MAX_RECENT);
      save();
      showError("");
      input.value = url;
      document.getElementById("open").disabled = true;
      document.getElementById("open").textContent = "Подключаюсь…";
      location.href = url;
    }

    function render() {
      recent.replaceChildren(...servers.map((url) => {
        const li = document.createElement("li");
        const openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "open";
        openBtn.textContent = url;
        openBtn.onclick = () => open(url);
        const forget = document.createElement("button");
        forget.type = "button";
        forget.className = "forget";
        forget.textContent = "×";
        forget.setAttribute("aria-label", "Забыть " + url);
        forget.onclick = () => {
          servers = servers.filter((s) => s !== url);
          save();
          render();
        };
        li.append(openBtn, forget);
        return li;
      }));
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      open(input.value);
    });

    input.value = params.get("server") || servers[0] || "";
    showError(params.get("error") || "");
    render();
  </script>
</body>
</html>
