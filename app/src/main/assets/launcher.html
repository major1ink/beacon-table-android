<!doctype html>
<!-- Цвета и заставка — как у страницы входа стола (web/index.html в Beacon-Table). -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beacon Table</title>
<style>
  :root {
    --bg: #131318; --surface: #26262f; --surface-hover: #303039;
    --border: rgba(255, 255, 255, 0.08); --text: #eee; --text-dim: rgba(238, 238, 238, 0.55);
    --accent: #7c6cf0; --accent-hover: #6a5ae0; --accent-bg: rgba(124, 108, 240, 0.16);
    --lamp: #fbbf4c; --green: #7fd694; --danger: #e07a7a;
    --glass: rgba(22, 22, 29, 0.92); --glass-border: rgba(255, 255, 255, 0.07);
    --radius: 12px; --radius-lg: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); overflow-x: hidden;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  svg { flex: 0 0 auto; }

  /* 30% — чтобы маяк не уезжал за край на узком экране, как на странице входа. */
  .bg {
    position: fixed; inset: 0;
    background:
      linear-gradient(to bottom, rgba(7, 7, 11, 0) 35%, rgba(7, 7, 11, 0.7) 70%, #07070b),
      #0b1220 url("splash.svg") 30% center / cover no-repeat;
  }

  .shell {
    position: relative; min-height: 100%; max-width: 460px; margin: 0 auto;
    display: flex; flex-direction: column; justify-content: space-between; gap: 24px;
    padding: max(8vh, 32px) 16px 16px;
  }

  .brand { text-align: center; animation: rise 0.6s ease-out both; }
  .brand h1 {
    margin: 0; font: 600 34px/1.1 "Cormorant Garamond", Georgia, "Noto Serif", serif; letter-spacing: 0.02em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.6);
  }
  .brand p { margin: 6px 0 0; color: var(--text-dim); font-size: 14px; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); }

  .sheet {
    padding: 18px 16px 16px; border-radius: var(--radius-lg);
    background: var(--glass); border: 1px solid var(--glass-border);
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.45);
    animation: rise 0.5s 0.1s ease-out both;
  }
  .group + .group, .group + .manual { margin-top: 18px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; min-height: 28px; margin-bottom: 6px; }
  .group-title { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); }

  .scan { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 999px; font-size: 13px; color: var(--text-dim); }
  .scan:active { background: var(--surface); }
  .scan .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 0 0 rgba(251, 191, 76, 0.6); }
  .scan.busy .dot { animation: ping 1.4s ease-out infinite; }
  .scan:not(.busy) .dot { display: none; }
  .scan.busy svg { display: none; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .list li { display: flex; align-items: stretch; border-radius: var(--radius); background: var(--surface); }
  .list li.appear { animation: fade 0.3s ease-out both; }
  .row { flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; border-radius: var(--radius); }
  .row:active { background: var(--surface-hover); }
  .row-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); color: var(--text-dim); }
  .nearby .row-icon { background: rgba(127, 214, 148, 0.12); color: var(--green); }
  .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 13px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row > svg { color: var(--text-dim); }
  .forget { width: 44px; display: grid; place-items: center; color: var(--text-dim); border-radius: var(--radius); }
  .forget:active { background: var(--surface-hover); color: var(--text); }

  .empty { margin: 0; padding: 12px; border-radius: var(--radius); border: 1px dashed var(--border); color: var(--text-dim); font-size: 13.5px; }

  .manual label { display: block; margin-bottom: 8px; }
  .field { display: flex; gap: 8px; }
  .field input {
    flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: rgba(0, 0, 0, 0.35); color: var(--text); font: inherit; font-size: 16px;
  }
  .field input::placeholder { color: rgba(238, 238, 238, 0.3); }
  .field input:focus { outline: none; border-color: var(--accent); }
  .go { width: 52px; height: 52px; border-radius: var(--radius); display: grid; place-items: center; background: var(--accent); color: #fff; }
  .go:active { background: var(--accent-hover); }
  .hint { margin: 8px 2px 0; color: var(--text-dim); font-size: 12.5px; }

  .error { margin: 0 0 14px; padding: 10px 12px; border-radius: var(--radius); background: rgba(224, 122, 122, 0.12); color: var(--danger); font-size: 14px; }

  .connecting {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 18px; justify-items: center;
    padding: 24px; text-align: center; background: rgba(7, 7, 11, 0.82); animation: fade 0.2s ease-out both;
  }
  .connecting[hidden] { display: none; }
  .spinner { width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(251, 191, 76, 0.2); border-top-color: var(--lamp); animation: spin 0.9s linear infinite; }
  .connecting p { margin: 0; color: var(--text-dim); }
  .connecting b { display: block; margin-top: 4px; color: var(--text); font-weight: 600; word-break: break-all; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes spin { to { transform: rotate(1turn); } }
  @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(251, 191, 76, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 76, 0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }

  /* Альбомный телефон: заставка слева, панель справа. */
  @media (orientation: landscape) and (max-height: 560px) {
    .shell { max-width: none; flex-direction: row; align-items: center; padding: 16px 24px; }
    .brand { flex: 1; align-self: flex-end; text-align: left; }
    .sheet { flex: 0 0 min(420px, 55vw); max-height: calc(100vh - 32px); overflow-y: auto; }
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <main class="shell">
    <header class="brand">
      <h1>Beacon Table</h1>
      <p>Подключитесь к столу ведущего</p>
    </header>

    <section class="sheet">
      <p class="error" id="error" hidden></p>

      <div class="group" id="nearbyGroup" hidden>
        <div class="group-head">
          <span class="group-title">Рядом</span>
          <button class="scan" id="scan" type="button">
            <span class="dot"></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            <span id="scanText">Ищу в сети…</span>
          </button>
        </div>
        <ul class="list nearby" id="nearby"></ul>
        <p class="empty" id="nearbyEmpty" hidden></p>
      </div>

      <div class="group" id="recentGroup" hidden>
        <div class="group-head"><span class="group-title">Недавние</span></div>
        <ul class="list" id="recent"></ul>
      </div>

      <form class="group manual" id="form" novalidate>
        <label class="group-title" for="server">Адрес вручную</label>
        <div class="field">
          <input id="server" placeholder="192.168.1.10:8080" inputmode="url" autocomplete="url"
                 autocapitalize="off" spellcheck="false" enterkeyhint="go">
          <button class="go" type="submit" aria-label="Открыть стол">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          </button>
        </div>
        <p class="hint">Адрес показывает ведущий — в трее программы или в настройках стола.</p>
      </form>
    </section>
  </main>

  <div class="connecting" id="connecting" hidden>
    <div class="spinner"></div>
    <p>Подключаюсь к столу<b id="connectingTo"></b></p>
  </div>

  <template id="rowTpl">
    <li>
      <button class="row" type="button">
        <span class="row-icon"></span>
        <span class="row-text"><span class="row-title"></span><span class="row-sub"></span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </li>
  </template>

  <script>
    const KEY = "servers";
    const MAX_RECENT = 5;
    const ICON_WIFI = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M2 9a15 15 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1"/></svg>';
    const ICON_CLOCK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
    const ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const app = window.beaconApp;
    const nearby = new Map();
    const shown = new Set();
    let scanning = false;
    let noNetwork = false;

    let servers = [];
    try {
      servers = JSON.parse(localStorage.getItem(KEY)) || [];
    } catch {}

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(servers));
      } catch {}
    }

    function showError(text) {
      $("error").textContent = text;
      $("error").hidden = !text;
    }

    // Без схемы: адрес в локальной сети — http (так стол и запускают дома),
    // остальное — https, как набрал бы человек в адресной строке.
    function serverURL(raw) {
      raw = raw.trim();
      if (!raw) throw new Error("Укажите адрес сервера, например 192.168.1.10:8080");
      if (!raw.includes("://")) raw = (isLocal(raw.split(/[/:]/)[0]) ? "http://" : "https://") + raw;
      const bad = new Error("Не похоже на адрес сервера: " + raw);
      let url;
      try {
        url = new URL(raw);
      } catch {
        throw bad;
      }
      if (url.protocol !== "http:" && url.protocol !== "https:") throw bad;
      const host = url.hostname.replace(/^\[|\]$/g, "");
      if (!isLocal(host) && !host.replace(/^\.+|\.+$/g, "").includes(".")) throw bad;
      return raw;
    }

    function isLocal(host) {
      return host === "localhost" || host.endsWith(".local") || /^[\d.]+$/.test(host) || host.includes(":");
    }

    const origin = (url) => {
      try {
        return new URL(url).origin;
      } catch {
        return url;
      }
    };
    const pretty = (url) => url.replace(/^https?:\/\//, "").replace(/\/$/, "");

    function open(raw) {
      let url;
      try {
        url = serverURL(raw);
      } catch (e) {
        showError(e.message);
        return;
      }
      servers = [url, ...servers.filter((s) => origin(s) !== origin(url))].slice(0, MAX_RECENT);
      save();
      showError("");
      $("connectingTo").textContent = pretty(url);
      $("connecting").hidden = false;
      location.href = url;
    }

    function row(url, sub, icon, onForget) {
      const li = $("rowTpl").content.firstElementChild.cloneNode(true);
      const key = (onForget ? "recent " : "near ") + origin(url);
      if (!shown.has(key)) li.classList.add("appear");
      shown.add(key);
      li.querySelector(".row-icon").innerHTML = icon;
      li.querySelector(".row-title").textContent = pretty(url);
      li.querySelector(".row-sub").textContent = sub;
      li.querySelector(".row").onclick = () => open(url);
      if (onForget) {
        const forget = document.createElement("button");
        forget.type = "button";
        forget.className = "forget";
        forget.innerHTML = ICON_X;
        forget.setAttribute("aria-label", "Забыть " + pretty(url));
        forget.onclick = onForget;
        li.append(forget);
      }
      return li;
    }

    function render() {
      const found = [...nearby.values()];
      $("nearby").replaceChildren(...found.map((s) =>
        row(s.url, ["В этой сети", /^\d/.test(s.version) && "v" + s.version].filter(Boolean).join(" · "), ICON_WIFI)));

      const empty = $("nearbyEmpty");
      empty.hidden = scanning || found.length > 0;
      empty.textContent = noNetwork
        ? "Телефон не в Wi-Fi — искать стол не в чем. Подключитесь к той же сети, что и ведущий."
        : "В этой сети стола не нашлось. Проверьте, что ведущий запустил Beacon Table, или впишите адрес ниже.";
      $("scan").classList.toggle("busy", scanning);
      $("scanText").textContent = scanning ? "Ищу в сети…" : "Обновить";

      const nearbyOrigins = new Set(found.map((s) => origin(s.url)));
      const recent = servers.filter((s) => !nearbyOrigins.has(origin(s)));
      $("recent").replaceChildren(...recent.map((url) =>
        row(url, "Открывали раньше", ICON_CLOCK, () => {
          servers = servers.filter((s) => s !== url);
          save();
          render();
        })));
      $("recentGroup").hidden = recent.length === 0;
    }

    function scan() {
      if (!app || scanning) return;
      nearby.clear();
      scanning = true;
      noNetwork = false;
      render();
      app.postMessage("scan");
    }

    if (app) {
      $("nearbyGroup").hidden = false;
      app.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.found) nearby.set(origin(msg.found), { url: msg.found, version: msg.version });
        if (msg.done) {
          scanning = false;
          noNetwork = !msg.network;
        }
        render();
      };
      $("scan").onclick = scan;
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      open($("server").value);
    });

    // Вернулись со стола (ошибка, «Назад») — страница могла прийти из кэша истории.
    addEventListener("pageshow", () => ($("connecting").hidden = true));

    $("server").value = params.get("server") || "";
    showError(params.get("error") || "");
    render();
    scan();
  </script>
</body>
</html>
